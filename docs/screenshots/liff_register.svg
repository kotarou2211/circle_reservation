<svg width="320" height="430" viewBox="0 0 320 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>LIFF登録画面のイメージ</title>
<defs>
  <clipPath id="clip1"><rect x="0" y="0" width="320" height="430" rx="24"/></clipPath>
</defs>
<rect x="0" y="0" width="320" height="430" rx="24" fill="#ffffff" stroke="#e5e7eb"/>
<g clip-path="url(#clip1)">
  <rect x="0" y="0" width="320" height="430" fill="#f7f8fa"/>
  <rect x="0" y="0" width="320" height="48" fill="#06c755"/>
  <text x="160" y="24" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">説明会予約</text>

  <rect x="16" y="72" width="288" height="310" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="32" y="98" fill="#06c755" font-size="12" font-weight="bold" font-family="sans-serif">○○大学○○サークルの説明会予約画面です！</text>

  <text x="32" y="122" fill="#111827" font-size="14" font-weight="bold" font-family="sans-serif">はじめに登録してください</text>
  <text x="32" y="142" fill="#6b7280" font-size="10.5" font-family="sans-serif">予約の前に、簡単な情報の登録をお願いします。</text>

  <text x="32" y="168" fill="#6b7280" font-size="10" font-family="sans-serif">お名前</text>
  <rect x="32" y="172" width="256" height="32" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="42" y="192" fill="#9ca3af" font-size="12" font-family="sans-serif">山田 太郎</text>

  <text x="32" y="220" fill="#6b7280" font-size="10" font-family="sans-serif">学年</text>
  <rect x="32" y="224" width="256" height="32" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="42" y="244" fill="#9ca3af" font-size="12" font-family="sans-serif">選択してください</text>

  <text x="32" y="272" fill="#6b7280" font-size="10" font-family="sans-serif">学部</text>
  <rect x="32" y="276" width="256" height="32" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="42" y="296" fill="#9ca3af" font-size="12" font-family="sans-serif">選択してください</text>

  <rect x="32" y="328" width="256" height="42" rx="10" fill="#06c755"/>
  <text x="160" y="349" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif">登録して予約に進む</text>
</g>
</svg>
