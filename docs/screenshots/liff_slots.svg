<svg width="320" height="430" viewBox="0 0 320 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>LIFF予約枠一覧画面のイメージ</title>
<defs>
  <clipPath id="clip2"><rect x="0" y="0" width="320" height="430" rx="24"/></clipPath>
</defs>
<rect x="0" y="0" width="320" height="430" rx="24" fill="#ffffff" stroke="#e5e7eb"/>
<g clip-path="url(#clip2)">
  <rect x="0" y="0" width="320" height="430" fill="#f7f8fa"/>
  <rect x="0" y="0" width="320" height="48" fill="#06c755"/>
  <text x="160" y="24" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">説明会予約</text>

  <!-- card1: reservable -->
  <rect x="16" y="64" width="288" height="112" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="90" fill="#111827" font-size="13" font-weight="bold" font-family="sans-serif">説明会 第1回</text>
  <text x="32" y="110" fill="#6b7280" font-size="10.5" font-family="sans-serif">10/15(水) 14:00〜15:00・本館2F・3/10名</text>
  <rect x="32" y="126" width="256" height="34" rx="9" fill="#06c755"/>
  <text x="160" y="143" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif">予約する</text>

  <!-- card2: reserved -->
  <rect x="16" y="188" width="288" height="112" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="214" fill="#111827" font-size="13" font-weight="bold" font-family="sans-serif">説明会 第2回</text>
  <text x="32" y="234" fill="#6b7280" font-size="10.5" font-family="sans-serif">10/18(土) 11:00〜12:00・本館2F・6/10名</text>
  <rect x="32" y="248" width="60" height="18" rx="9" fill="#dcfce7"/>
  <text x="62" y="257" text-anchor="middle" dominant-baseline="central" fill="#15803d" font-size="10" font-weight="bold" font-family="sans-serif">予約済み</text>
  <rect x="32" y="272" width="256" height="30" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="160" y="287" text-anchor="middle" dominant-baseline="central" fill="#dc2626" font-size="11" font-weight="bold" font-family="sans-serif">キャンセルする</text>

  <!-- card3: full -->
  <rect x="16" y="312" width="288" height="90" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="338" fill="#111827" font-size="13" font-weight="bold" font-family="sans-serif">説明会 第3回</text>
  <text x="32" y="358" fill="#6b7280" font-size="10.5" font-family="sans-serif">10/22(水) 14:00〜15:00・本館2F・10/10名</text>
  <rect x="32" y="372" width="42" height="18" rx="9" fill="#fee2e2"/>
  <text x="53" y="381" text-anchor="middle" dominant-baseline="central" fill="#dc2626" font-size="10" font-weight="bold" font-family="sans-serif">満席</text>
</g>
</svg>
